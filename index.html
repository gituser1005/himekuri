<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFE2">
  <title>ぬいコテージ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ぬいコテージ">
  <!-- 時計の部分はアプリの外（明るい帯）にする。black-translucent で絵を時計の裏まで出すと、iPhone は開くたびに
       アプリの高さを時計のぶん短くしたりしなかったりして、下に空きが出るため（2026-10-30 に iPhone 13 で確かめた）。
       製品版で Capacitor に入れるときは、StatusBar を WebView に重ねて絵を時計の裏まで出し、日付や帯は env(safe-area-inset-*) の内側に置く -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app"></main>
  <script type="module" src="js/main.js"></script>
  <script>
    // 開発中（localhost）はキャッシュで古いファイルが出ないよう、Service Worker を使わない
    if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
