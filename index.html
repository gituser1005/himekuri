<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e2d4">
  <title>ひめくり</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ひめくり">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="pad" id="pad"></div>
    <div class="pile" id="pile" aria-label="めくった紙"></div>
    <button class="record-btn" id="record-btn">きろく</button>
  </main>
  <script type="module" src="js/main.js"></script>
  <script>
    // 開発中（localhost）はキャッシュで古いファイルが出ないよう、Service Worker を使わない
    if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
